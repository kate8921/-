<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カスタムストップウォッチ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:white;font-family:system-ui;text-align:center;padding:20px}
.panel{max-width:1000px;margin:auto}.controls,.buttons{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;align-items:center;margin:18px}
label{display:flex;gap:8px;align-items:center}input,select,button{font-size:18px;padding:9px;border-radius:8px}
input[type=color]{padding:2px;width:55px;height:42px}.box{aspect-ratio:16/9;border:1px solid #555;border-radius:15px;overflow:hidden;
background-image:linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);
background-size:30px 30px;background-position:0 0,0 15px,15px -15px,-15px 0}
canvas{width:100%;height:100%;display:block}button{cursor:pointer;border:0}#status{margin:12px;min-height:25px}
.rangeout{min-width:46px;text-align:left}
</style></head>
<body><div class="panel"><h1>ストップウォッチ動画メーカー</h1>
<div class="controls">
<label>停止時間 <input id="t" type="number" step=".01" min=".01" value="2.89" style="width:100px">秒</label>
<label>フォント <select id="font"><option>Arial</option><option>Arial Black</option><option>Impact</option><option>Courier New</option><option>Times New Roman</option><option>Georgia</option><option>Meiryo</option><option>Yu Gothic</option></select></label>
<label>文字色 <input id="fg" type="color" value="#ffffff"></label>
<label>背景色 <input id="bg" type="color" value="#000000"></label>
<label>背景透過率 <input id="alpha" type="range" min="0" max="100" value="0"><span id="alphaOut" class="rangeout">0%</span></label>
</div>
<div class="box"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="buttons"><button id="play">プレビュー</button><button id="save">動画保存</button><button id="reset">リセット</button></div>
<div id="status"></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),T=document.querySelector('#t'),F=document.querySelector('#font'),FG=document.querySelector('#fg'),BG=document.querySelector('#bg'),A=document.querySelector('#alpha'),AO=document.querySelector('#alphaOut'),S=document.querySelector('#status');
let run=false,id=null,last=0;
function val(){let v=Number(T.value);if(!Number.isFinite(v)||v<=0)v=2.89;v=Math.round(v*100)/100;T.value=v.toFixed(2);return v}
function clamp(v,a,b){return Math.min(Math.max(v,a),b)}
function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function draw(v,max=Infinity){
 v=Number.isFinite(v)?v:0;v=clamp(v,0,max);v=Math.max(0,Math.round(v*100)/100);last=v;
 x.clearRect(0,0,c.width,c.height);
 const [r,g,b]=hexRgb(BG.value);
 const opacity=1-(Number(A.value)/100);
 if(opacity>0){x.fillStyle=`rgba(${r},${g},${b},${opacity})`;x.fillRect(0,0,c.width,c.height)}
 x.fillStyle=FG.value;x.textAlign='center';x.textBaseline='middle';x.font='800 360px "'+F.value+'"';x.fillText(v.toFixed(2),960,540)
}
function stop(){run=false;if(id!==null)cancelAnimationFrame(id);id=null}
function anim(t,done){stop();run=true;const st=performance.now();draw(0,t);function f(n){if(!run)return;const e=clamp((n-st)/1000,0,t);draw(e,t);if(e>=t){run=false;id=null;done&&done();return}id=requestAnimationFrame(f)}id=requestAnimationFrame(f)}
play.onclick=()=>{const t=val();S.textContent='プレビュー中…';anim(t,()=>S.textContent=t.toFixed(2)+'秒で停止')};
reset.onclick=()=>{stop();draw(0);S.textContent=''};
A.oninput=()=>{AO.textContent=A.value+'%';if(!run)draw(last)};
[F,FG,BG].forEach(e=>e.oninput=()=>{if(!run)draw(last)});
function supportedMime(){
 if(!window.MediaRecorder)return null;
 // WebM VP9 supports alpha in compatible Chromium workflows better than MP4/H.264.
 const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4;codecs=avc1.42E01E','video/mp4'];
 return types.find(m=>MediaRecorder.isTypeSupported(m))||null
}
save.onclick=()=>{
 stop();const m=supportedMime();if(!m){S.textContent='このブラウザでは動画保存に対応していません。';return}
 const t=val(),chunks=[],r=new MediaRecorder(c.captureStream(60),{mimeType:m,videoBitsPerSecond:10000000});
 r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 r.onstop=()=>{const blob=new Blob(chunks,{type:m}),u=URL.createObjectURL(blob),a=document.createElement('a');
 const ext=m.includes('webm')?'webm':'mp4';a.href=u;a.download='stopwatch_'+t.toFixed(2).replace('.','_')+'s.'+ext;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);S.textContent='動画を保存しました（'+ext.toUpperCase()+'）'};
 draw(0,t);r.start();S.textContent='動画作成中…';const st=performance.now();
 function f(n){const e=clamp((n-st)/1000,0,t);draw(e,t);if(e>=t){setTimeout(()=>r.stop(),1000);return}requestAnimationFrame(f)}requestAnimationFrame(f)
};
AO.textContent=A.value+'%';draw(0);
</script></body></html>
