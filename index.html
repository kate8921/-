<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カスタムストップウォッチ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#181818;color:white;font-family:system-ui;text-align:center;padding:20px}.panel{max-width:1000px;margin:auto}.controls,.buttons{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;align-items:center;margin:18px}label{display:flex;gap:8px;align-items:center}input,select,button{font-size:18px;padding:9px;border-radius:8px}input[type=color]{padding:2px;width:55px;height:42px}.box{aspect-ratio:16/9;border:1px solid #555;border-radius:15px;overflow:hidden}canvas{width:100%;height:100%;display:block}button{cursor:pointer;border:0}#status{margin:12px;min-height:25px}</style></head>
<body><div class="panel"><h1>ストップウォッチ動画メーカー</h1><div class="controls">
<label>停止時間 <input id="t" type="number" step=".01" min=".01" value="2.89" style="width:100px">秒</label>
<label>フォント <select id="font"><option>Arial</option><option>Arial Black</option><option>Impact</option><option>Courier New</option><option>Times New Roman</option><option>Georgia</option><option>Meiryo</option><option>Yu Gothic</option></select></label>
<label>文字色 <input id="fg" type="color" value="#ffffff"></label><label>背景色 <input id="bg" type="color" value="#000000"></label>
</div><div class="box"><canvas id="c" width="1920" height="1080"></canvas></div><div class="buttons"><button id="play">プレビュー</button><button id="save">MP4保存</button><button id="reset">リセット</button></div><div id="status"></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),T=document.querySelector('#t'),F=document.querySelector('#font'),FG=document.querySelector('#fg'),BG=document.querySelector('#bg'),S=document.querySelector('#status');let run=false,id,last=0;
function val(){let v=+T.value;if(!(v>0))v=2.89;v=Math.round(v*100)/100;T.value=v.toFixed(2);return v}
function draw(v){last=v;x.fillStyle=BG.value;x.fillRect(0,0,1920,1080);x.fillStyle=FG.value;x.textAlign='center';x.textBaseline='middle';x.font='800 360px "'+F.value+'"';x.fillText(v.toFixed(2),960,540)}
function stop(){run=false;cancelAnimationFrame(id)}
function anim(t,done){stop();run=true;let st=performance.now();draw(0);function f(n){if(!run)return;let e=(n-st)/1000;if(e>=t){draw(t);run=false;done&&done();return}draw(e);id=requestAnimationFrame(f)}id=requestAnimationFrame(f)}
play.onclick=()=>{let t=val();S.textContent='プレビュー中…';anim(t,()=>S.textContent=t.toFixed(2)+'秒で停止')};reset.onclick=()=>{stop();draw(0);S.textContent=''};[F,FG,BG].forEach(e=>e.oninput=()=>{if(!run)draw(last)});
function mime(){return ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=h264','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))}
save.onclick=()=>{stop();let m=mime();if(!m){S.textContent='このブラウザではMP4直接保存に対応していません。Chrome / Edge最新版で試してください。';return}let t=val(),chunks=[],r=new MediaRecorder(c.captureStream(60),{mimeType:m,videoBitsPerSecond:10000000});r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:m})),a=document.createElement('a');a.href=u;a.download='stopwatch_'+t.toFixed(2).replace('.','_')+'s.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);S.textContent='MP4を保存しました'};r.start();S.textContent='MP4作成中…';let st=performance.now();function f(n){let e=(n-st)/1000;if(e>=t){draw(t);setTimeout(()=>r.stop(),1000);return}draw(e);requestAnimationFrame(f)}requestAnimationFrame(f)};
draw(0);
</script></body></html>
