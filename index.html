<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ストップウォッチ動画メーカー</title>
<style>
  * { box-sizing: border-box; }
  html,body{
    margin:0; min-height:100%;
    background:#111; color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{width:min(920px,96vw);text-align:center}
  h1{font-size:clamp(24px,4vw,44px);margin:0 0 24px}
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
    margin-bottom:22px;font-size:clamp(18px,2.4vw,28px)
  }
  input{
    width:150px;padding:10px 12px;font-size:28px;text-align:center;
    border-radius:10px;border:1px solid #777
  }
  button{
    padding:13px 24px;border:0;border-radius:12px;
    font-size:22px;cursor:pointer
  }
  #previewBtn{background:#fff;color:#111}
  #saveBtn{background:#e9e9e9;color:#111}
  #resetBtn{background:#333;color:#fff;border:1px solid #666}
  .previewBox{
    background:#000;border:1px solid #444;border-radius:18px;
    overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center
  }
  canvas{width:100%;height:100%;display:block}
  .status{margin-top:16px;min-height:1.5em;font-size:17px;opacity:.75}
  .note{margin-top:10px;font-size:14px;opacity:.5;line-height:1.6}
</style>
</head>
<body>
<div class="panel">
  <h1>ストップウォッチ動画メーカー</h1>

  <div class="controls">
    <label>停止時間
      <input id="target" type="number" min="0.01" step="0.01" value="2.89">
      秒
    </label>
    <button id="previewBtn">プレビュー</button>
    <button id="saveBtn">MP4保存</button>
    <button id="resetBtn">リセット</button>
  </div>

  <div class="previewBox">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="status" class="status"></div>
  <div class="note">
    出力動画は 1920×1080 / 黒背景 / 白文字。<br>
    指定時間で停止後、約1秒静止して終了します。
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const targetEl = document.getElementById('target');
const previewBtn = document.getElementById('previewBtn');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

let running = false;
let raf = null;

function getTarget(){
  let v = parseFloat(targetEl.value);
  if(!Number.isFinite(v) || v <= 0) v = 2.89;
  v = Math.round(v * 100) / 100;
  targetEl.value = v.toFixed(2);
  return v;
}

function draw(sec){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 360px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(sec.toFixed(2), canvas.width/2, canvas.height/2);
}

function stopAnimation(){
  running = false;
  if(raf) cancelAnimationFrame(raf);
  raf = null;
}

function animate(target, onDone){
  stopAnimation();
  running = true;
  const start = performance.now();

  function frame(now){
    if(!running) return;
    const elapsed = (now - start) / 1000;
    if(elapsed >= target){
      draw(target);
      running = false;
      if(onDone) onDone();
      return;
    }
    draw(elapsed);
    raf = requestAnimationFrame(frame);
  }
  draw(0);
  raf = requestAnimationFrame(frame);
}

previewBtn.addEventListener('click', () => {
  const t = getTarget();
  statusEl.textContent = 'プレビュー中…';
  animate(t, () => {
    statusEl.textContent = `${t.toFixed(2)} 秒で停止`;
  });
});

resetBtn.addEventListener('click', () => {
  stopAnimation();
  draw(0);
  statusEl.textContent = '';
});

function chooseMp4Mime(){
  const candidates = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4;codecs=h264',
    'video/mp4'
  ];
  for(const mime of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(mime)) return mime;
  }
  return null;
}

saveBtn.addEventListener('click', async () => {
  if(running) stopAnimation();

  const mime = chooseMp4Mime();
  if(!mime){
    statusEl.textContent =
      'このブラウザは直接MP4保存に対応していません。Chrome / Edgeの最新版で試してください。';
    return;
  }

  const target = getTarget();
  const stream = canvas.captureStream(60);
  const chunks = [];

  let recorder;
  try{
    recorder = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: 10000000
    });
  }catch(e){
    statusEl.textContent = 'MP4録画を開始できませんでした。別のブラウザで試してください。';
    return;
  }

  recorder.ondataavailable = e => {
    if(e.data && e.data.size) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safe = target.toFixed(2).replace('.', '_');
    a.href = url;
    a.download = `stopwatch_${safe}s.mp4`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    statusEl.textContent = `MP4を保存しました：${target.toFixed(2)} 秒`;
  };

  draw(0);
  recorder.start();
  statusEl.textContent = 'MP4を作成中…';

  const start = performance.now();

  function recordFrame(now){
    const elapsed = (now - start) / 1000;
    if(elapsed >= target){
      draw(target);
      setTimeout(() => recorder.stop(), 1000);
      return;
    }
    draw(elapsed);
    requestAnimationFrame(recordFrame);
  }

  requestAnimationFrame(recordFrame);
});

draw(0);
</script>
</body>
</html>
